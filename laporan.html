<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan - Mie Ayam & Bakso</title>
<style>
:root{--navy:#17324d;--bg:#f3f6fa;--green:#168653;--muted:#64748b;--line:#dce4ec;--red:#c0392b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:700}.primary{background:var(--green);color:#fff}.secondary{background:#e8eef5;color:var(--navy)}header{background:var(--navy);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}header h1{font-size:19px;margin:0}main{max-width:1200px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 2px 8px #18324d08}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px}.field label,.label{font-size:12px;color:var(--muted)}input{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.big{font-size:22px;font-weight:800;margin-top:7px}.table-wrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);background:#f8fafc}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:10px;z-index:20;max-width:90%}.login{max-width:390px;margin:10vh auto;padding:20px}.login .panel{padding:24px}.login input{width:100%;margin:10px 0}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}@media(max-width:750px){main{padding:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:18px}}
</style></head><body>
<section id="loginScreen" class="login"><div class="panel"><h1>📊 Laporan Kasir</h1><p class="small">Masukkan PIN pemilik untuk membuka laporan.</p><form id="loginForm"><input id="pin" type="password" inputmode="numeric" maxlength="8" required placeholder="PIN pemilik"><button class="primary" style="width:100%">Masuk</button></form><button class="secondary" style="width:100%;margin-top:8px" onclick="location.href='index.html'">Kembali ke Kasir</button></div></section>
<div id="app" class="hidden"><header><div><h1>📊 Laporan MIE AYAM & BAKSO ARRAYYAN</h1><small id="userInfo">Riwayat transaksi</small></div><div><button class="secondary" onclick="location.href='index.html'">← Kembali ke Kasir</button> <button class="secondary" onclick="logout()">Keluar</button></div></header>
<main><section class="panel"><div class="section-title"><h2>Riwayat Transaksi</h2><span class="small">Filter tanggal dan metode pembayaran</span></div><div class="filters"><div class="field"><label>Dari tanggal</label><input id="fromDate" type="date"></div><div class="field"><label>Sampai tanggal</label><input id="toDate" type="date"></div><div class="field"><label>Metode</label><select id="method"><option value="">Semua</option><option>Cash</option><option>QRIS</option></select></div><button class="primary" onclick="loadReport()">Terapkan Filter</button><button class="secondary" onclick="setPeriod('week')">Omzet Mingguan</button><button class="secondary" onclick="setPeriod('month')">Omzet Bulanan</button><button class="secondary" onclick="resetFilters()">Reset</button></div><div class="cards"><div class="card"><div class="label">Omzet</div><div class="big" id="omzet">Rp0</div></div><div class="card"><div class="label">Jumlah Transaksi</div><div class="big" id="count">0</div></div><div class="card"><div class="label">Total Cash</div><div class="big" id="cash">Rp0</div></div><div class="card"><div class="label">Total QRIS</div><div class="big" id="qris">Rp0</div></div></div><div id="transactions" class="table-wrap"></div></section>
<section class="panel" style="margin-top:14px"><div class="section-title"><h2>Riwayat Tutup Kas</h2><button class="secondary" onclick="loadCashHistory()">Refresh</button></div><div id="cashHistory" class="table-wrap"></div></section></main></div><div id="editModal" class="hidden" style="position:fixed;inset:0;background:#10203099;z-index:30;padding:16px;overflow:auto"><div class="panel" style="max-width:620px;margin:5vh auto"><div class="section-title"><h2>Edit Transaksi</h2><button class="secondary" onclick="closeEdit()">Tutup</button></div><p id="editMeta" class="small"></p><div id="editItems"></div><div class="field" style="margin-top:12px"><label>Metode pembayaran</label><select id="editMethod" onchange="toggleEditReceived()"><option>Cash</option><option>QRIS</option></select></div><div class="field" id="editReceivedWrap" style="margin-top:10px"><label>Uang diterima</label><input id="editReceived" type="number" min="0" step="500"></div><div class="section-title" style="margin-top:14px"><strong id="editTotal">Total: Rp0</strong><button class="primary" onclick="saveEdit()">Simpan Perubahan</button></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxD-AYKTKOi6Nit6TG7Uv_yYKSSXRkXUDKa6ASj__mZbdWHIL2piRHA5beZccqpFa5v/exechttps://script.google.com/macros/s/AKfycbxD-AYKTKOi6Nit6TG7Uv_yYKSSXRkXUDKa6ASj__mZbdWHIL2piRHA5beZccqpFa5v/exec';let SESSION_PIN=sessionStorage.getItem('kasirSessionPin')||'';let ALL_TX=[];let EDIT_TX=null;const $=id=>document.getElementById(id);const rupiah=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function apiCall(action,...args){return new Promise((resolve,reject)=>{if(!API_URL||API_URL.includes('PASTE_APPS_SCRIPT'))return reject(Error('URL Apps Script belum diatur di laporan.html.'));const cb='__report_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script'),timer=setTimeout(()=>{clean();reject(Error('Server timeout. Periksa URL dan koneksi.'))},20000);function clean(){clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()}window[cb]=p=>{clean();p&&p.ok?resolve(p.data):reject(Error(p&&p.error||'Permintaan gagal'))};s.onerror=()=>{clean();reject(Error('Tidak bisa menghubungi Apps Script.'))};s.src=API_URL+'?'+new URLSearchParams({action,callback:cb,pin:SESSION_PIN,args:JSON.stringify(args)});document.body.appendChild(s)})}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();SESSION_PIN=$('pin').value;try{const r=await apiCall('login');if(r.role!=='owner')throw Error('Laporan hanya bisa dibuka oleh pemilik.');sessionStorage.setItem('kasirSessionPin',SESSION_PIN);showApp();await loadReport();await loadCashHistory()}catch(err){SESSION_PIN='';toast(err.message||'Login gagal')}});
function showApp(){$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('userInfo').textContent='Login sebagai Pemilik'}
async function boot(){if(!SESSION_PIN)return;try{const r=await apiCall('login');if(r.role!=='owner')throw Error('PIN bukan PIN pemilik.');showApp();await loadReport();await loadCashHistory()}catch(e){sessionStorage.removeItem('kasirSessionPin');SESSION_PIN='';toast(e.message)}}
async function loadReport(){try{ALL_TX=await apiCall('getReport',{from:$('fromDate').value,to:$('toDate').value});renderTransactions()}catch(e){toast(e.message||'Gagal memuat laporan')}}
function dateISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function setPeriod(which){
  const now=new Date();let from,to=dateISO(now);
  if(which==='week'){const monday=new Date(now);const day=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-day);from=dateISO(monday)}
  else {from=dateISO(new Date(now.getFullYear(),now.getMonth(),1))}
  $('fromDate').value=from;$('toDate').value=to;await loadReport();
}

function renderTransactions(){
 const method=$('method').value,rows=ALL_TX.filter(t=>!method||t.method===method);
 $('omzet').textContent=rupiah(rows.reduce((s,t)=>s+Number(t.total||0),0));
 $('count').textContent=rows.length;
 $('cash').textContent=rupiah(rows.filter(t=>t.method==='Cash').reduce((s,t)=>s+Number(t.total||0),0));
 $('qris').textContent=rupiah(rows.filter(t=>t.method==='QRIS').reduce((s,t)=>s+Number(t.total||0),0));
 $('transactions').innerHTML=rows.length?'<table><thead><tr><th>Tanggal</th><th>Waktu</th><th>No. Transaksi</th><th>Detail</th><th>Metode</th><th>Total</th><th>Diterima</th><th>Kembalian</th><th>Aksi</th></tr></thead><tbody>'+
 rows.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.time)}</td><td>${esc(t.no)}</td><td>${esc(t.detail)}</td><td>${esc(t.method)}</td><td>${rupiah(t.total)}</td><td>${rupiah(t.received)}</td><td>${rupiah(t.change)}</td><td><button class="secondary" onclick="editTransaction('${esc(t.no)}')">Edit</button> <button style="background:#fff0ee;color:#c0392b" onclick="removeTransaction('${esc(t.no)}')">Hapus</button></td></tr>`).join('')+
 '</tbody></table>':'<p class="small">Tidak ada transaksi pada filter ini.</p>';
}
async function editTransaction(no){
 try{
  EDIT_TX=await apiCall('getTransaction',no);
  $('editMeta').textContent=EDIT_TX.no+' • '+EDIT_TX.date+' '+EDIT_TX.time;
  $('editMethod').value=EDIT_TX.method;
  $('editReceived').value=Number(EDIT_TX.received||0);
  $('editItems').innerHTML=(EDIT_TX.items||[]).map((it,i)=>`<div class="field" style="margin:10px 0"><label>${esc(it.name)} — ${rupiah(it.price)} (jumlah 0 untuk menghapus item)</label><input class="editQty" data-id="${esc(it.id)}" data-price="${Number(it.price)}" data-name="${esc(it.name)}" type="number" min="0" step="1" value="${Number(it.qty)}"></div>`).join('');
  $('editModal').classList.remove('hidden');toggleEditReceived();updateEditTotal();
  document.querySelectorAll('.editQty').forEach(el=>el.addEventListener('input',updateEditTotal));
 }catch(e){toast(e.message||'Gagal membuka transaksi')}
}
function closeEdit(){$('editModal').classList.add('hidden');EDIT_TX=null}
function toggleEditReceived(){$('editReceivedWrap').style.display=$('editMethod').value==='Cash'?'flex':'none';updateEditTotal()}
function updateEditTotal(){
 const total=[...document.querySelectorAll('.editQty')].reduce((s,el)=>s+Math.max(0,Math.floor(Number(el.value)||0))*Number(el.dataset.price||0),0);
 $('editTotal').textContent='Total: '+rupiah(total);
 if($('editMethod').value==='QRIS')$('editReceived').value=total;
}
async function saveEdit(){
 if(!EDIT_TX)return;
 const items=[...document.querySelectorAll('.editQty')].map(el=>({id:el.dataset.id,qty:Math.floor(Number(el.value)||0)}));
 const total=[...document.querySelectorAll('.editQty')].reduce((s,el)=>s+Math.max(0,Math.floor(Number(el.value)||0))*Number(el.dataset.price||0),0);
 const method=$('editMethod').value,received=method==='Cash'?Number($('editReceived').value):total;
 if(!items.some(i=>i.qty>0)){toast('Transaksi tidak boleh kosong. Gunakan Hapus jika transaksi batal.');return}
 if(method==='Cash'&&(!Number.isFinite(received)||received<total)){toast('Uang diterima kurang dari total.');return}
 try{
  await apiCall('editTransaction',EDIT_TX.no,{items,method,received});
  closeEdit();toast('Transaksi berhasil diperbarui.');await loadReport();await loadCashHistory();
 }catch(e){toast(e.message||'Gagal menyimpan perubahan')}
}
async function removeTransaction(no){
 if(!confirm('Yakin hapus transaksi '+no+'? Penghapusan tidak bisa dibatalkan.'))return;
 try{await apiCall('deleteTransaction',no);toast('Transaksi berhasil dihapus.');await loadReport();await loadCashHistory()}
 catch(e){toast(e.message||'Gagal menghapus transaksi')}
}
function resetFilters(){$('fromDate').value='';$('toDate').value='';$('method').value='';loadReport()}
async function loadCashHistory(){try{const rows=await apiCall('getCashHistory');const closed=rows.filter(k=>k.closedAt);$('cashHistory').innerHTML=closed.length?'<table><thead><tr><th>Tanggal</th><th>Buka oleh</th><th>Tutup</th><th>Tutup oleh</th><th>Saldo Awal</th><th>Pengeluaran</th><th>Saldo Seharusnya</th><th>Uang Fisik</th><th>Selisih</th><th>Catatan</th></tr></thead><tbody>'+closed.map(k=>`<tr><td>${esc(k.date)}</td><td>${esc(k.openedBy)}</td><td>${esc(k.closedAt)}</td><td>${esc(k.closedBy)}</td><td>${rupiah(k.opening)}</td><td>${rupiah(k.expense)}</td><td>${rupiah(k.expected)}</td><td>${rupiah(k.physical)}</td><td>${rupiah(k.difference)}</td><td>${esc(k.closeNote||'')}</td></tr>`).join('')+'</tbody></table>':'<p class="small">Belum ada riwayat tutup kas.</p>'}catch(e){toast(e.message||'Gagal memuat riwayat kas')}}
function logout(){sessionStorage.removeItem('kasirSessionPin');location.href='index.html'}boot();
</script></body></html>
